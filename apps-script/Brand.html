<!-- Brand: font and logo for the top bar.
     This is the generic version. To use your company's brand, replace this
     file: define --font-brand (with its @font-face) and the .brand-logo background. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --font-brand: 'Plus Jakarta Sans'; }
  .brand-logo { display: inline-flex; align-items: center; gap: 8px; height: 30px; font-weight: 800; font-size: 15px;
                letter-spacing: -.3px; color: #000050; }
  .brand-logo::before { content: 'R'; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px;
